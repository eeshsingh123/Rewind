[project]
name = "rewind"
version = "0.1.0"
description = "Camera checker for production and packing lines, driven by plain-English rules over chat."
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewind", "sim", "eval"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "poethepoet>=0.49.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "A", "C4", "PT", "PIE", "RET"]

[tool.pyright]
include = ["src", "sim", "eval", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/rewind/contracts", "src/rewind/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_packages = ["rewind", "sim", "eval"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward: app -> adapters -> core -> contracts"
type = "layers"
layers = ["rewind.app", "rewind.adapters", "rewind.core", "rewind.contracts"]

[[tool.importlinter.contracts]]
name = "Contracts and core import no web, HTTP, SDK or settings libraries"
type = "forbidden"
source_modules = ["rewind.contracts", "rewind.core"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "httpx", "pydantic_settings", "cv2", "modal", "boto3"]

[[tool.importlinter.contracts]]
name = "The sim depends on contracts only"
type = "forbidden"
source_modules = ["sim"]
forbidden_modules = ["rewind.core", "rewind.adapters", "rewind.app", "eval"]

[[tool.importlinter.contracts]]
name = "Eval depends on contracts and core only"
type = "forbidden"
source_modules = ["eval"]
forbidden_modules = ["rewind.adapters", "rewind.app", "sim"]

[tool.poe.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "pyright"
imports = "lint-imports"
test = "pytest"
check = ["lint", "format-check", "typecheck", "imports", "test"]
serve = "uvicorn rewind.app.main:create_app --factory --host 127.0.0.1 --port 8000"
live = "python scripts/serve_live.py"
